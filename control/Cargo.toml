[package]
name = "control"
version = "0.1.0"
edition = "2024"

[dependencies]
a8mini-camera-rs = "0.2.1"

anyhow = "1.0.102"

ctrlc = "3.5.1"
flatbuffers = "25.12.19"

mavlink = { version = "0.17.1", features = ["tokio-1", "common", "ardupilotmega", "emit-extensions"] }
tokio = { version = "1.49.0", features = ["full"] }


zenoh = {version = "<=1.7", features = ["shared-memory"]}
zenoh-ext = "<=1.7"

[[bin]]
name = "control"
path = "src/main.rs"
