[project]
name = "guidance"
version = "0.1.0"
description = "guidance - Python Zenoh Node"
requires-python = ">=3.12"
dependencies = [
 "eclipse-zenoh<=1.7",
 "flatbuffers>=25.12.19",

 "python-statemachine>=3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]
viewer = [
  "mujoco>=3.0",
  "numpy>=1.26",
]

# this defines the entrypoint of the python program.
# we look in the package hello_world and find the function main (inside __init__.py)
# the function must be visible (i.e. imported or defined) in __init__.py
[project.scripts]
guidance = "guidance:main"
gigasniffer = "guidance:gigasniffer"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
