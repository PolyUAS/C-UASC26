[project]
name = "genesis_sim"
version = "0.1.0"
description = "genesis_sim - Python Zenoh Node"
requires-python = ">=3.12"
dependencies = [
 "eclipse-zenoh>=1.7.1",
 "flatbuffers>=25.12.19",
 "genesis-world>=0.3.11",
 "onshape-to-robot>=1.8.1",
 "torch>=2.10.0",
]

# this defines the entrypoint of the python program.
# we look in the package hello_world and find the function main (inside __init__.py)
# the function must be visible (i.e. imported or defined) in __init__.py
[project.scripts]
genesis_sim = "genesis_sim:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
