[project]
name = "vision"
version = "0.1.0"
description = "vision - Python Zenoh Node"
requires-python = ">=3.10"
dependencies = [
    "eclipse-zenoh>=1.7.1",
    "flatbuffers>=25.12.19",
    "opencv-python",                    # remove version pin

]

[[tool.uv.index]]
name = "jetson-ai-lab"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
default = true


[tool.uv.sources]
opencv-python = { index = "jetson-ai-lab" }


[project.scripts]
vision = "vision:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
