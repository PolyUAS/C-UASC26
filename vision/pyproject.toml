[project]
name = "vision"
version = "0.1.0"
description = "vision - Python Zenoh Node"
requires-python = "==3.10.*"
dependencies = [
    "eclipse-zenoh>=1.7.1",
    "flatbuffers>=25.12.19",
    "opencv-python",
    "ultralytics",
    "torch",
    "onnxruntime-gpu",
    "torchvision",

]

[tool.uv.sources]
opencv-python = { index = "jetson-cu126" }
onnxruntime-gpu = { index = "jetson-cu126" }
torch = [
  { index = "jetson-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "jetson-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]


[[tool.uv.index]]
name = "jetson-cu126"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126/"
explicit = true


[project.scripts]
vision = "vision:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
