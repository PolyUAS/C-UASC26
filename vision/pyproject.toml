[project]
name = "vision"
version = "0.1.0"
description = "vision - Python Zenoh Node"
requires-python = ">=3.12"
dependencies = [
  "eclipse-zenoh>=1.7.1",
  "flatbuffers>=25.12.19",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "ultralytics>=8.4.42",
]

[project.scripts]
vision = "vision:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'linux'"]
